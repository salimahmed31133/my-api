<!DOCTYPE html> 
<html lang="en"> 
<head> 
<script async src="https://www.googletagmanager.com/gtag/js?id=G-CFGFT13CS4"></script> 
<script> window.dataLayer = window.dataLayer || []; function gtag(){dataLayer.push(arguments);} gtag('js', new Date()); gtag('config', 'G-CFGFT13CS4'); </script> 
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<title>Dashboard - FreeDownloaderSite</title> 
<style> 
/* আপনার অরিজিনাল লাইট মোড ডিজাইন */
body { 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    background: #f8f9fa; 
    margin: 0; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    min-height: 100vh; 
    padding-bottom: 40px; 
} 

.site-title-container { margin-top: 35px; width: 95%; display: flex; justify-content: center; } 
.site-title { font-size: 28px; font-weight: 900; color: #000000; text-align: center; letter-spacing: -0.5px; } 

.disclaimer { font-size: 14px; color: #000000; font-weight: 700; text-align: center; width: 80%; margin: 12px 0 20px 0; line-height: 1.6; } 

.auth-card { 
    background: white; 
    padding: 40px 25px; 
    border-radius: 30px; 
    box-shadow: 0 15px 50px rgba(0,0,0,0.06); 
    width: 90%; 
    max-width: 450px; 
    text-align: center; 
    border: 1px solid #eee; 
    box-sizing: border-box; 
    z-index: 1; 
} 

.label-text { font-size: 15px; font-weight: 700; color: #000; margin-bottom: 10px; display: block; text-align: left; padding-left: 5px; } 

.input-container { position: relative; width: 100%; margin-bottom: 25px; } 
.input-box { 
    width: 100%; 
    padding: 18px 50px 18px 18px; 
    border: 1.5px solid #ddd; 
    border-radius: 18px; 
    box-sizing: border-box; 
    font-size: 16px; 
    outline: none; 
    background: #fafafa; 
    color: #000; 
} 

select { 
    width: 100%; 
    padding: 18px; 
    margin-bottom: 25px; 
    border: 1.5px solid #ddd; 
    border-radius: 18px; 
    box-sizing: border-box; 
    font-size: 16px; 
    outline: none; 
    background: #fafafa; 
    color: #000; 
    font-weight: 600; 
} 

.main-btn { 
    background: #000000; 
    color: white; 
    border: 2.5px solid #D4AF37; 
    padding: 20px; 
    width: 100%; 
    border-radius: 18px; 
    font-size: 20px; 
    font-weight: 800; 
    cursor: pointer; 
    margin-top: 10px; 
    text-transform: uppercase; 
    letter-spacing: 1px; 
    box-shadow: 0 8px 20px rgba(0,0,0,0.15); 
} 

.ad-slot { width: 90%; max-width: 450px; min-height: 70px; background: #f0f0f0; border: 1px dashed #ccc; margin: 15px 0; border-radius: 15px; display: flex; align-items: center; justify-content: center; color: #888; font-size: 12px; }

/* অটোমেটিক ডার্ক মোড - লজিক আলাদা রাখা হয়েছে */
@media (prefers-color-scheme: dark) {
    body { background: #121212 !important; color: #ffffff !important; }
    .site-title, .disclaimer, .label-text { color: #ffffff !important; }
    .auth-card { background: #1a1a1a !important; border-color: #333 !important; }
    .input-box, select { background: #222 !important; color: #fff !important; border-color: #444 !important; }
    input::placeholder { color: #888 !important; }
}

/* ম্যানুয়াল ডার্ক থিম */
body.dark-theme { background: #121212 !important; color: #ffffff !important; }
.dark-theme .auth-card { background: #1a1a1a !important; border-color: #333 !important; }
.dark-theme .site-title, .dark-theme .disclaimer, .dark-theme .label-text { color: #ffffff !important; }
.dark-theme input, .dark-theme select { background: #222 !important; color: #fff !important; border-color: #444 !important; }
</style> 
</head> 
<body> 
    <div class="site-title-container"> <div class="site-title">FreeDownloaderSite</div> </div> 
    <div class="ad-slot">Banner Advertisement Space</div> 
    <div class="disclaimer"> How you use it is your business and your responsibility. </div> 
    <div class="auth-card"> 
        <span class="label-text">Select Video Quality:</span> 
        <select id="quality"> 
            <option value="1080">1080p Full HD</option> 
            <option value="720">720p HD</option> 
            <option value="480">480p Standard</option> 
            <option value="mp3">MP3 Audio</option> 
        </select> 
        <span class="label-text">Paste Link:</span> 
        <div class="input-container"> 
            <input type="text" id="videoUrl" class="input-box" placeholder="Paste link here..." oninput="toggleClearBtn()"> 
            <div id="clearBtn" class="clear-btn" onclick="clearInput()">✕</div> 
        </div> 
        <span class="label-text">Select Platform:</span> 
        <select id="platform"> 
            <option value="auto" selected>All in One (Auto Detect)</option> 
            <option value="fb">Facebook</option> 
            <option value="ig">Instagram</option> 
            <option value="cc">CapCut</option> 
            <option value="tk">TikTok</option> 
        </select> 
        <button class="main-btn" id="processBtn" onclick="startProcess()">PROCESS VIDEO</button> 
    </div>

    <script>
        // আপনার জাভাস্ক্রিপ্ট লজিক যা আগের কোডে ছিল...
    </script>
</body> 
</html>
