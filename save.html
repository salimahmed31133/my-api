<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save Video - FreeDownloaderSite</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f8f9fa; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding-bottom: 40px; }
        .auth-card { background: white; padding: 30px; border-radius: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); width: 90%; max-width: 450px; text-align: center; margin-top: 50px; border: 1px solid #eee; }
        .video-preview-container { width: 100%; border-radius: 20px; background: #000; margin-bottom: 20px; overflow: hidden; }
        video { width: 100%; display: block; max-height: 400px; }
        .download-btn { background: #1a1a1a; color: white; border: 2.5px solid #D4AF37; padding: 18px; width: 100%; border-radius: 15px; font-size: 20px; font-weight: 800; cursor: pointer; text-transform: uppercase; transition: 0.3s; display: block; text-decoration: none; border: none; }
        .download-btn:active { transform: scale(0.98); }
        .new-download { margin-top: 20px; display: inline-block; color: #1a1a1a; text-decoration: none; font-weight: bold; border-bottom: 2px solid #1a1a1a; }
        body.dark-theme { background-color: #121212; color: #f1f1f1; }
        .dark-theme .auth-card { background-color: #1a1a1a; border-color: #444; color: #fff; }
    </style>
</head>
<body>
    <div class="auth-card">
        <h2 style="color: #2ecc71;">✓ Video Ready</h2>
        <div class="video-preview-container">
            <video id="videoPlayer" controls playsinline>
                <source id="videoSource" src="" type="video/mp4">
            </video>
        </div>
        
        <button id="mainDownloadBtn" class="download-btn" onclick="startDownload()">DOWNLOAD NOW</button>
        
        <br>
        <a href="dashboard.html" class="new-download">Download Another Video</a>
    </div>

    <script>
        const videoUrl = localStorage.getItem("downloadableUrl");

        window.onload = function() {
            if (videoUrl && videoUrl !== "undefined") {
                const player = document.getElementById("videoPlayer");
                const source = document.getElementById("videoSource");
                source.src = videoUrl;
                player.load();
            } else {
                window.location.href = "dashboard.html";
            }
        };

        async function startDownload() {
            const btn = document.getElementById("mainDownloadBtn");
            btn.innerText = "STARTING...";
            
            try {
                // ভিডিওর ডেটা ফেচ করা
                const response = await fetch(videoUrl);
                const blob = await response.blob();
                
                // মেমোরিতে একটি টেম্পোরারি লিংক তৈরি করা
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                // এই লাইনটি ব্রাউজারকে প্লে করতে বাধা দেয় এবং ডাউনলোড নোটিফিকেশন পাঠায়
                a.download = "FreeSave_" + Date.now() + ".mp4";
                
                document.body.appendChild(a);
                a.click();
                
                // কাজ শেষে মেমোরি ক্লিয়ার করা
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
                
                btn.innerText = "DONE!";
            } catch (error) {
                // যদি মেমোরি মেথড কাজ না করে (CORS), তবে সাধারণ পদ্ধতিতে পাঠাবে
                const a = document.createElement('a');
                a.href = videoUrl;
                a.setAttribute('download', 'video.mp4');
                a.click();
                btn.innerText = "DOWNLOAD NOW";
            }
            
            setTimeout(() => {
                btn.innerText = "DOWNLOAD NOW";
            }, 3000);
        }

        if (localStorage.getItem("theme") === "dark") {
            document.body.classList.add("dark-theme");
        }
    </script>
</body>
</html>
