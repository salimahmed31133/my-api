<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreeSave - Threads Downloader</title>
    <style>
        :root { --p: #000; --s: #28a745; --bg: #f4f7f6; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #fff; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; }
        input { width: 100%; padding: 15px; border: 2px solid #ddd; border-radius: 12px; font-size: 16px; outline: none; }
        button { background: var(--p); color: #fff; border: none; padding: 15px; border-radius: 12px; cursor: pointer; width: 100%; margin-top: 15px; font-weight: bold; }
        #loader { display: none; border: 4px solid #f3f3f3; border-top: 4px solid var(--s); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        video { width: 100%; border-radius: 12px; margin-top: 20px; }
        .dl-btn { display: block; background: var(--s); color: #fff; text-decoration: none; padding: 15px; border-radius: 12px; margin-top: 15px; font-weight: bold; }
        .err { color: #d9534f; background: #fdf2f2; padding: 12px; border-radius: 10px; margin-top: 20px; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>
<div class="card">
    <h2>FreeSave 🎥</h2>
    <p>নির্দিষ্ট ভিডিওর লিঙ্কটি পেস্ট করুন</p>
    <input type="text" id="url" placeholder="লিঙ্কটি এখানে দিন...">
    <button onclick="dl()">ভিডিও খুঁজুন</button>
    <div id="loader"></div>
    <div id="res"></div>
</div>
<script>
    async function dl() {
        let input = document.getElementById('url').value.trim();
        const res = document.getElementById('res');
        const ld = document.getElementById('loader');
        if(!input) return alert("লিঙ্ক দিন!");
        
        // ডোমেইন এবং ক্লিনআপ লজিক
        let url = input.replace('threads.com', 'threads.net');
        
        // চেক: লিঙ্কটি কি পোস্টের লিঙ্ক?
        if (!url.includes('/post/') && !url.includes('/t/')) {
            res.innerHTML = `<div class="err">⚠️ এটি প্রোফাইল লিঙ্ক! ভিডিওর শেয়ার বাটন থেকে লিঙ্ক কপি করুন।</div>`;
            return;
        }

        res.innerHTML = "";
        ld.style.display = "block";
        try {
            const api = `https://threads-test-1.onrender.com/download?url=${encodeURIComponent(url)}`;
            const r = await fetch(api);
            const d = await r.json();
            ld.style.display = "none";
            if (d.url) {
                res.innerHTML = `<video controls autoplay><source src="${d.url}" type="video/mp4"></video><a href="${d.url}" target="_blank" download class="dl-btn">গ্যালারিতে সেভ করুন</a>`;
            } else {
                res.innerHTML = `<div class="err">❌ ভিডিও পাওয়া যায়নি। হয়তো লিঙ্কটি ভুল।</div>`;
            }
        } catch (e) {
            ld.style.display = "none";
            res.innerHTML = `<div class="err">📡 সার্ভার কানেক্ট হচ্ছে না। একটু পর চেষ্টা করুন।</div>`;
        }
    }
</script>
</body>
</html>
